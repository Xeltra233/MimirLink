services:
  mimirlink:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: mimirlink
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data
      - ./logs:/app/logs
      - ./audio:/app/audio
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
